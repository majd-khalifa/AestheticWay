name: Owner approved Android signed bundle

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Unused, monotonically increasing Play versionCode
        required: true
        type: string
      build_name:
        description: Public version name
        default: '1.0.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  signed-bundle:
    if: github.ref == 'refs/heads/main'
    environment: android-release
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - name: Compile using externally managed upload signing credentials
        shell: bash
        env:
          AW_ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.AW_ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          AW_ANDROID_STORE_PASSWORD: ${{ secrets.AW_ANDROID_STORE_PASSWORD }}
          AW_ANDROID_KEY_ALIAS: ${{ secrets.AW_ANDROID_KEY_ALIAS }}
          AW_ANDROID_KEY_PASSWORD: ${{ secrets.AW_ANDROID_KEY_PASSWORD }}
          AW_ANDROID_UPLOAD_CERT_SHA256: ${{ vars.AW_ANDROID_UPLOAD_CERT_SHA256 }}
          AW_RELEASE_BUILD_NUMBER: ${{ inputs.build_number }}
          AW_RELEASE_BUILD_NAME: ${{ inputs.build_name }}
        run: |
          set -euo pipefail
          [[ "$AW_RELEASE_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$AW_RELEASE_BUILD_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -n "$AW_ANDROID_UPLOAD_CERT_SHA256"
          release_key_dir=$(mktemp -d "$RUNNER_TEMP/aw-upload.XXXXXX")
          trap 'rm -rf "$release_key_dir"' EXIT
          export AW_ANDROID_STORE_FILE="$release_key_dir/upload-key.jks"
          python -c 'import os,base64; p=os.environ["AW_ANDROID_STORE_FILE"]; f=os.open(p,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600); os.write(f,base64.b64decode(os.environ["AW_ANDROID_UPLOAD_KEYSTORE_BASE64"],validate=True)); os.close(f)'
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          flutter pub get
          flutter build appbundle --release --build-name "$AW_RELEASE_BUILD_NAME" --build-number "$AW_RELEASE_BUILD_NUMBER"
          curl --fail --location --silent --show-error https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o "$RUNNER_TEMP/bundletool.jar"
          python tool/verify_android_bundle.py --bundle build/app/outputs/bundle/release/app-release.aab --bundletool "$RUNNER_TEMP/bundletool.jar" --expected-certificate-sha256 "$AW_ANDROID_UPLOAD_CERT_SHA256" --output release-evidence/android-aab.json
      - name: Retain signed bundle for owner review; no Play upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-reviewed-android-bundle
          path: |
            build/app/outputs/bundle/release/app-release.aab
            release-evidence/android-aab.json
          retention-days: 3
